version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jacqueline-db
    environment:
      POSTGRES_DB: jacqueline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postpass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - jacqueline-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jacqueline-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jacqueline
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jacqueline-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  jacqueline-network:
    driver: bridge


